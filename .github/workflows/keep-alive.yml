name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed app (follow redirects, keep session cookies)
        run: |
          curl -sL -c /dev/null -o /dev/null -w "HTTP %{http_code} - %{url_effective}\n" \
            "https://ax-hackathon-entreci.streamlit.app/"
